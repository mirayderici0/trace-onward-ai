<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TRACE ONWARD — Lead Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #F4F0E8;
            color: #20262B;
            min-height: 100vh;
        }

        .page {
            width: min(1180px, 92%);
            margin: 0 auto;
            padding-bottom: 70px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 32px 0;
            border-bottom: 1px solid #DCD6CB;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 4px;
        }

        .admin-label {
            font-size: 13px;
            color: #777E79;
        }

        .intro {
            padding: 55px 0 35px;
        }

        .eyebrow {
            font-size: 12px;
            letter-spacing: 2px;
            color: #C46F52;
            font-weight: 700;
            margin-bottom: 14px;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: clamp(42px, 5vw, 68px);
            font-weight: 400;
            line-height: 1;
        }

        .intro p {
            margin-top: 18px;
            color: #69716D;
            max-width: 650px;
            line-height: 1.6;
        }

        .summary-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #20262B;
            color: white;
            border-radius: 20px;
            padding: 22px 26px;
            margin-bottom: 24px;
        }

        .summary-card span {
            color: #C9CEC9;
            font-size: 13px;
        }

        .summary-number {
            font-family: Georgia, serif;
            font-size: 38px;
        }

        .dashboard-card {
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(32, 38, 43, 0.10);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(32, 38, 43, 0.08);
        }

        .table-header,
        .lead-row {
            display: grid;
            grid-template-columns:
                70px
                1.4fr
                1.2fr
                2fr
                1.2fr;

            gap: 18px;
            align-items: center;
        }

        .table-header {
            padding: 16px 22px;
            background: #E8E3D9;
            color: #757C77;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .lead-row {
            padding: 20px 22px;
            border-top: 1px solid #E1DDD4;
        }

        .lead-row:first-child {
            border-top: 0;
        }

        .lead-id {
            color: #999E9A;
            font-size: 13px;
        }

        .lead-name {
            font-weight: 700;
        }

        .lead-phone {
            color: #565E59;
        }

        .lead-message {
            color: #626A66;
            line-height: 1.4;
        }

        .lead-date {
            color: #888F8B;
            font-size: 13px;
        }

        .empty-state {
            padding: 60px 30px;
            text-align: center;
            color: #777E79;
        }

        .error-state {
            padding: 30px;
            color: #A34E39;
        }

        .refresh-button {
            border: 0;
            border-radius: 11px;
            padding: 10px 16px;
            cursor: pointer;
            background: #C46F52;
            color: white;
            font-weight: 700;
        }

        .refresh-button:hover {
            opacity: 0.9;
        }

        @media (max-width: 850px) {
            .table-header {
                display: none;
            }

            .lead-row {
                grid-template-columns: 1fr;
                gap: 7px;
            }

            .lead-id {
                display: none;
            }

            .lead-name {
                font-size: 18px;
            }

            .lead-message {
                margin: 4px 0;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header>
        <div class="logo">TRACE ONWARD</div>
        <div class="admin-label">Lead Management</div>
    </header>


    <section class="intro">

        <div class="eyebrow">
            EARLY ACCESS / LEADS
        </div>

        <h1>
            People who left<br>
            their trace.
        </h1>

        <p>
            Review people who are interested in TRACE ONWARD,
            their contact information and the message they left.
        </p>

    </section>


    <section class="summary-card">

        <div>
            <span>Total leads</span>
            <div
                class="summary-number"
                id="leadCount">
                0
            </div>
        </div>

        <button
            class="refresh-button"
            id="refreshButton">
            Refresh
        </button>

    </section>


    <section class="dashboard-card">

        <div class="table-header">
            <div>ID</div>
            <div>Name</div>
            <div>Phone</div>
            <div>Message</div>
            <div>Date</div>
        </div>

        <div id="leadList">
            <div class="empty-state">
                Loading leads...
            </div>
        </div>

    </section>

</div>


<script>

    const leadList =
        document.getElementById("leadList");

    const leadCount =
        document.getElementById("leadCount");

    const refreshButton =
        document.getElementById("refreshButton");


    function createLeadRow(lead) {

        const row =
            document.createElement("div");

        row.className = "lead-row";


        const id =
            document.createElement("div");

        id.className = "lead-id";
        id.textContent = "#" + lead.id;


        const name =
            document.createElement("div");

        name.className = "lead-name";
        name.textContent =
            lead.name || "-";


        const phone =
            document.createElement("div");

        phone.className = "lead-phone";
        phone.textContent =
            lead.phone || "-";


        const message =
            document.createElement("div");

        message.className = "lead-message";
        message.textContent =
            lead.message || "No message";


        const date =
            document.createElement("div");

        date.className = "lead-date";
        date.textContent =
            lead.date || "-";


        row.appendChild(id);
        row.appendChild(name);
        row.appendChild(phone);
        row.appendChild(message);
        row.appendChild(date);

        return row;
    }


    async function loadLeads() {

        leadList.innerHTML =
            '<div class="empty-state">Loading leads...</div>';

        refreshButton.disabled = true;


        try {

            const response =
                await fetch("/api/leads");

            const data =
                await response.json();


            if (!response.ok || !data.basari) {

                throw new Error(
                    data.hata || "Could not load leads."
                );

            }


            leadList.innerHTML = "";

            leadCount.textContent =
                data.leads.length;


            if (data.leads.length === 0) {

                leadList.innerHTML =
                    '<div class="empty-state">No leads yet.</div>';

                return;
            }


            data.leads.forEach(function (lead) {

                leadList.appendChild(
                    createLeadRow(lead)
                );

            });


        } catch (error) {

            leadList.innerHTML =
                '<div class="error-state">Leads could not be loaded.</div>';

        } finally {

            refreshButton.disabled = false;

        }

    }


    refreshButton.addEventListener(
        "click",
        loadLeads
    );


    loadLeads();

</script>

</body>
</html>
